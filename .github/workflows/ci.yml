name: CI

on:
  push:
    branches:
      - main

# Allow GitHub Actions to request an AWS OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Download the repository code into the GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v4

        # Authenticate to AWS using OIDC — no stored AWS access keys required
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::560396669076:role/GitHubActionsDeployRole
          aws-region: eu-west-2

        # Authenticate Docker with Amazon ECR so the image can be pushed
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

        # Confirm the required application files exist before building
      - name: Validate application files
        run: |
          test -f app/index.html || { echo "ERROR: app/index.html is missing"; exit 1; }
          test -f app/style.css || { echo "ERROR: app/style.css is missing"; exit 1; }

        # Build the application into a Docker image
      - name: Build Docker image
        run: docker build -t cloud-cicd-app ./app

        # Run the container and verify the web application responds successfully
      - name: Test Docker container
        run: |
          docker run -d --name ci-test -p 8080:80 cloud-cicd-app
          sleep 2
          curl --fail http://localhost:8080
          docker stop ci-test

        # Tag and push the tested Docker image to Amazon ECR
      - name: Push Docker image to ECR
        run: |
          docker tag cloud-cicd-app 560396669076.dkr.ecr.eu-west-2.amazonaws.com/cloud-cicd-app:${{ github.sha }}
          docker push 560396669076.dkr.ecr.eu-west-2.amazonaws.com/cloud-cicd-app:${{ github.sha }}

        # Remove the temporary test container even if an earlier step fails
      - name: Clean up test container
        if: always()
        run: docker rm -f ci-test || true
